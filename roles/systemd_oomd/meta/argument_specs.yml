---
argument_specs:
  main:
    options:
      systemd_oomd_service_name:
        type: str
      systemd_oomd_configuration_file:
        type: path
      systemd_oomd_configuration:
        type: dict
        options:
          OOM:
            type: dict
            options:
              SwapUsedLimit:
                type: str
              DefaultMemoryPressureLimit:
                type: str
              DefaultMemoryPressureDurationSec:
                type: str
      systemd_oomd_package_name:
        type: str
      systemd_oomd_package_version:
        type: str
      systemd_oomd_package_state:
        type: str
        choices:
          - present
          - absent
