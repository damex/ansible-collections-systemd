---
- name: Ensure systemd pstore pstore.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_pstore_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_pstore_configuration }}"
  become: true
  register: systemd_pstore_conf
  when: systemd_pstore_configuration is defined
