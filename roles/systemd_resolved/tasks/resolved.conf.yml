---
- name: Ensure systemd resolved resolved.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_resolved_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_resolved_configuration }}"
  become: true
  register: systemd_resolved_conf
  when: systemd_resolved_configuration is defined
