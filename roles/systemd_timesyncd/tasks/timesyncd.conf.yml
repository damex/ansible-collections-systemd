---
- name: Ensure systemd timesyncd timesyncd.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_timesyncd_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_timesyncd_configuration }}"
  become: true
  register: systemd_timesyncd_conf
  when: systemd_timesyncd_configuration is defined
