---
- name: Ensure systemd networkd networkd.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_networkd_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_networkd_conf_configuration }}"
  become: true
  register: systemd_networkd_conf
  when: systemd_networkd_conf_configuration is defined
