---
systemd_networkd_service_name: systemd-networkd
systemd_networkd_configuration_file: /etc/systemd/networkd.conf
systemd_networkd_network_speedmeter: false
systemd_networkd_network_speedmeterintervalsec: 10sec
systemd_networkd_network_manageforeignroutingpolicyrules: true
systemd_networkd_network_manageforeignroutes: true
systemd_networkd_network_routetable: ""
systemd_networkd_dhcp_duidtype: vendor
systemd_networkd_dhcp_duidtyperawdata: ""
systemd_networkd_dhcp_usedomains: false
systemd_networkd_dhcpv4_duidtype: "{{ systemd_networkd_dhcp_duidtype }}"
systemd_networkd_dhcpv4_duidtyperawdata: "{{ systemd_networkd_dhcp_duidtyperawdata }}"
systemd_networkd_dhcpv4_usedomains: "{{ systemd_networkd_dhcp_usedomains }}"
systemd_networkd_dhcpv6_duidtype: "{{ systemd_networkd_dhcp_duidtype }}"
systemd_networkd_dhcpv6_duidtyperawdata: "{{ systemd_networkd_dhcp_duidtyperawdata }}"
systemd_networkd_dhcpv6_usedomains: "{{ systemd_networkd_dhcp_usedomains }}"
