---
- name: Ensure systemd journald journald.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_journald_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_journald_configuration }}"
  become: true
  register: systemd_journald_conf
  when: systemd_journald_configuration is defined
