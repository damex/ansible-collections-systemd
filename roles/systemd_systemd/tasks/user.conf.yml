---
- name: Ensure systemd systemd user.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_systemd_user_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_systemd_user_configuration }}"
  become: true
  notify: Ensure systemd daemon-reexec
  when: systemd_systemd_user_configuration is defined
