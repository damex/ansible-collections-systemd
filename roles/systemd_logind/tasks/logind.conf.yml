---
- name: Ensure systemd logind logind.conf
  ansible.builtin.template:
    src: "{{ role_path | dirname | dirname }}/templates/configuration.j2"
    dest: "{{ systemd_logind_configuration_file }}"
    group: root
    owner: root
    mode: "0644"
  vars:
    systemd_configuration: "{{ systemd_logind_configuration }}"
  become: true
  register: systemd_logind_conf
  when: systemd_logind_configuration is defined
